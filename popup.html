<!DOCTYPE html>
<html>
  <body style="min-width: 220px; font-family: sans-serif; padding: 12px;">
    <label for="semesterStart" style="display: block; margin-bottom: 6px; font-size: 12px;">
      Semester start
    </label>
    <input id="semesterStart" type="date" style="width: 100%; margin-bottom: 10px; box-sizing: border-box;" />

    <label for="semesterEnd" style="display: block; margin-bottom: 6px; font-size: 12px;">
      Semester end
    </label>
    <input id="semesterEnd" type="date" style="width: 100%; margin-bottom: 12px; box-sizing: border-box;" />

    <button id="runBtn" style="width: 100%; padding: 8px; cursor: pointer;">
      Save Schedule to ICS (calendar file)
    </button>

    <script src="popup.js"></script>
  </body>
</html>
